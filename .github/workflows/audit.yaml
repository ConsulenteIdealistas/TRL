name: TRL audit pilot

# 評価の監査 (監査役) のパイロット (手動実行 + 土曜 09:00 JST の週次実行)。本番のパイプラインとは独立で、
# 監査は評価を読み取るだけで点・状態は変えない。結果は DB の audit_results と
# audit-reports/ にだけ残る。完走率とフラグ品質の測定用。
# data ブランチへの書込みが本番と競合しないよう、同時実行グループを共有する。
on:
  schedule:
    # 土曜 09:00 JST = 土曜 00:00 UTC。その週の定期実行 (火〜金) が全て終わった後に回す
    - cron: "0 0 * * 6"
  workflow_dispatch:
    inputs:
      limit:
        description: "Evaluations to audit"
        type: string
        default: "100"
      budget_sec:
        description: "Overall time budget in seconds"
        type: string
        default: "9000"

concurrency:
  group: trl-pipeline
  cancel-in-progress: false

permissions: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check data branch
        id: data_branch
        run: |
          set +e
          git ls-remote --exit-code --heads origin data >/dev/null 2>&1
          rc=$?
          set -e

          if [ "$rc" -eq 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif [ "$rc" -eq 2 ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Could not check data branch (rc=$rc). Aborting to protect data"
            exit 1
          fi
      - name: Restore data branch
        if: steps.data_branch.outputs.exists == 'true'
        uses: actions/checkout@v6
        with:
          ref: data
          path: _data
          # Persist の push が資格情報を読めずに落ちるのを防ぐため、checkout の
          # 資格情報を _data の git 設定に保持する。トークンを URL に埋め込む
          # 手動受け渡し (旧方式) は使わない (AC-1)
          persist-credentials: true
      - name: Prepare data directory
        if: steps.data_branch.outputs.exists != 'true'
        run: mkdir -p _data
      - name: Verify data branch contents
        if: steps.data_branch.outputs.exists == 'true'
        run: |
          if [ ! -f _data/trl.sqlite ]; then
            echo "::error::data branch exists but trl.sqlite is missing. Aborting to protect data"
            exit 1
          fi
          python3 -c "import sqlite3; r = sqlite3.connect('file:_data/trl.sqlite?mode=ro', uri=True).execute('PRAGMA integrity_check').fetchone()[0]; assert r == 'ok', r" || { echo "::error::trl.sqlite failed the integrity check. Aborting to protect data"; exit 1; }
      - name: Audit evaluations
        env:
          IN_LIMIT: ${{ inputs.limit || '100' }}
          IN_BUDGET: ${{ inputs.budget_sec || '9000' }}
        run: |
          python trl.py audit --data-dir _data --limit "$IN_LIMIT" --budget-sec "$IN_BUDGET"
      - name: Persist data (preserve history)
        if: always()
        run: |
          if [ ! -d _data ]; then
            echo "No data directory to persist"
            exit 0
          fi

          cd _data

          if [ -z "$(ls -A .)" ]; then
            echo "No data to persist"
            exit 0
          fi

          if [ ! -d .git ]; then
            git init -q -b data
            git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
            # data ブランチが無く checkout できなかった場合の初期化経路。
            # トークンを URL に埋め込む旧方式は使わず、ルートの checkout が
            # 保持した資格情報 (extraheader) を引き継ぐ
            if AUTH_HEADER=$(git -C "$GITHUB_WORKSPACE" config --get "http.https://github.com/.extraheader" 2>/dev/null); then
              git config "http.https://github.com/.extraheader" "$AUTH_HEADER"
            fi
          fi

          git config user.name github-actions
          git config user.email actions@users.noreply.github.com

          git add -A

          if git diff --cached --quiet; then
            echo "No data changes to commit"
            exit 0
          fi

          git commit -q -m "data $(date -u +%FT%TZ)"
          # push の一時的な失敗でその回の収集・評価が失われないよう、3回まで試す
          for i in 1 2 3; do
            if git push -q origin HEAD:data; then
              exit 0
            fi
            echo "push failed (attempt $i), retrying..."
            sleep 5
          done
          # backup (AC-1): 通常の push が非 fast-forward 等で 3 回とも失敗した場合の
          # 最終手段。その回の収集・評価が丸ごと失われるよりは、force push で
          # 自実行のコミットを data ブランチへ保存する
          echo "::warning::Normal push failed after 3 attempts; falling back to force push to avoid losing this run's data"
          if git push -q --force origin HEAD:data; then
            exit 0
          fi
          echo "::error::Could not persist data after 3 attempts and the force-push fallback"
          exit 1
