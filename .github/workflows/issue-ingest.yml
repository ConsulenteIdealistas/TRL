name: issue-ingest

on:
  issues:
    types: [opened, labeled, edited]

permissions:
  contents: write
  issues: write

jobs:
  ingest:
    if: contains(github.event.issue.labels.*.name, 'ai-eval')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Ingest
        env:
          PYTHONPATH: src
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -m digest.main ingest-issue --issue-number ${{ github.event.issue.number }}
      - name: Commit digest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/digests
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: ingest issue #${{ github.event.issue.number }}"
            git push
          fi