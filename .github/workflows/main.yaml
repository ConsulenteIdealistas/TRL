name: TRL pipeline

on:
  workflow_dispatch:
    inputs:
      sources:
        description: "Sources"
        type: choice
        options: ["pubmed,arxiv,gnews,prtimes,trials", "pubmed,arxiv", "pubmed", "arxiv"]
        default: "pubmed,arxiv,gnews,prtimes,trials"
      kinds:
        description: "Evaluation kinds"
        type: choice
        options: ["long", "event", "long,event"]
        default: "long"
      max_eval:
        description: "Max candidates to evaluate per run"
        type: string
        default: "10"
      retry_failed:
        description: "Retry previously failed evaluations?"
        type: choice
        options: ["no", "yes", "force"]
        default: "no"
  schedule:
    - cron: "30 21 * * 1"   # Mondays 21:30 UTC (Tuesday 06:30 JST)

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: trl-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest test_trl test_entities test_site -v
      - name: Restore data branch
        run: |
          set +e
          git ls-remote --exit-code --heads origin data >/dev/null 2>&1
          rc=$?
          set -e

          if [ "$rc" -eq 0 ]; then
            git clone -q --depth 1 --branch data "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" _data
          elif [ "$rc" -eq 2 ]; then
            mkdir -p _data
          else
            echo "::error::Could not check data branch (rc=$rc). Aborting to protect data"
            exit 1
          fi
      - name: Run pipeline
        env:
          TRL_LLM_PROVIDER: ${{ vars.TRL_LLM_PROVIDER }}
          TRL_LLM_MODEL: ${{ vars.TRL_LLM_MODEL }}
          TRL_LLM_FALLBACK_MODEL: ${{ vars.TRL_LLM_FALLBACK_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          # 入力はシェルに直接展開せず環境変数経由で渡す(スクリプトインジェクション対策)
          IN_SOURCES: ${{ inputs.sources || 'pubmed,arxiv,gnews,prtimes,trials' }}
          IN_KINDS: ${{ inputs.kinds || 'long' }}
          IN_MAX_EVAL: ${{ inputs.max_eval || '10' }}
          IN_RETRY: ${{ inputs.retry_failed || 'no' }}
        run: |
          python trl.py run --data-dir _data \
            --sources "$IN_SOURCES" \
            --kinds "$IN_KINDS" \
            --max-eval "$IN_MAX_EVAL" \
            --retry-failed "$IN_RETRY"
      - name: Export site (data.json + web)
        if: always() && hashFiles('_data/trl.sqlite') != ''
        run: python trl.py export --data-dir _data --out _site
      - name: Upload site artifact
        if: always() && hashFiles('_site/data.json') != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Persist data (preserve history)
        if: always()
        run: |
          if [ ! -d _data ]; then
            echo "No data directory to persist"
            exit 0
          fi

          cd _data

          if [ -z "$(ls -A .)" ]; then
            echo "No data to persist"
            exit 0
          fi

          if [ ! -d .git ]; then
            git init -q -b data
            git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi

          git config user.name github-actions
          git config user.email actions@users.noreply.github.com

          git add -A

          if git diff --cached --quiet; then
            echo "No data changes to commit"
            exit 0
          fi

          git commit -q -m "data $(date -u +%FT%TZ)"
          git push -q origin data

  deploy:
    # Settings -> Pages -> Source を「GitHub Actions」にしておくこと
    needs: run
    if: needs.run.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
