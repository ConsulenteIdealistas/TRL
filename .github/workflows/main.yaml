name: TRL pipeline

on:
  workflow_dispatch:
    inputs:
      src_pubmed:
        description: "Source: PubMed"
        type: boolean
        default: true
      src_arxiv:
        description: "Source: arXiv"
        type: boolean
        default: true
      src_gnews:
        description: "Source: Google News"
        type: boolean
        default: true
      src_prtimes:
        description: "Source: PR TIMES"
        type: boolean
        default: true
      src_trials:
        description: "Source: ClinicalTrials.gov"
        type: boolean
        default: true
      src_yahoo:
        description: "Source: Yahoo Finance"
        type: boolean
        default: true
      src_openalex:
        description: "Source: OpenAlex"
        type: boolean
        default: true
      src_edinet:
        description: "Source: EDINET"
        type: boolean
        default: true
      src_edgar:
        description: "Source: SEC EDGAR"
        type: boolean
        default: true
      kinds:
        description: "Evaluation kinds"
        type: choice
        options: ["long", "event", "long,event"]
        default: "long"
      max_eval:
        description: "Max candidates to evaluate per run"
        type: string
        default: "5"
      retry_failed:
        description: "Retry previously failed evaluations?"
        type: choice
        options: ["no", "yes", "force"]
        default: "no"
      purge_evaluations:
        description: "Purge all evaluations before running?"
        type: choice
        options: ["no", "yes"]
        default: "no"
      only_new:
        description: "Evaluate only never-evaluated candidates?"
        type: choice
        options: ["no", "yes"]
        default: "no"
      depth:
        description: "Collection depth (deep = full windows / shallow = discovery windows capped to a few days)"
        type: choice
        options: ["deep", "shallow"]
        default: "deep"
  schedule:
    - cron: "30 21 * * 1-4"   # Mon-Thu 21:30 UTC (Tue-Fri 06:30 JST)

permissions: {}  # 既定は全拒否。必要な権限だけをジョブ単位で付ける (S-2)

concurrency:
  group: trl-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write  # チェックアウトと data ブランチへの保存に必要
      pages: write     # upload-pages-artifact に必要 (id-token は deploy 側だけに残す)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest test_trl test_entities test_site -v
      - name: Restore data branch
        env:
          TOKEN: ${{ github.token }}
        run: |
          set +e
          git ls-remote --exit-code --heads origin data >/dev/null 2>&1
          rc=$?
          set -e

          if [ "$rc" -eq 0 ]; then
            git clone -q --depth 1 --branch data "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" _data
          elif [ "$rc" -eq 2 ]; then
            mkdir -p _data
          else
            echo "::error::Could not check data branch (rc=$rc). Aborting to protect data"
            exit 1
          fi
          if [ "$rc" -eq 0 ]; then
            # data ブランチがあるのに trl.sqlite が無い・壊れている状態で進むと、
            # 空の DB が新規作成されて履歴が上書きされるため、ここで止める
            if [ ! -f _data/trl.sqlite ]; then
              echo "::error::data branch exists but trl.sqlite is missing. Aborting to protect data"
              exit 1
            fi
            python3 -c "import sqlite3; r = sqlite3.connect('file:_data/trl.sqlite?mode=ro', uri=True).execute('PRAGMA integrity_check').fetchone()[0]; assert r == 'ok', r" || { echo "::error::trl.sqlite failed the integrity check. Aborting to protect data"; exit 1; }
          fi
      - name: Run pipeline
        env:
          TRL_LLM_PROVIDER: ${{ vars.TRL_LLM_PROVIDER }}
          TRL_LLM_MODEL: ${{ vars.TRL_LLM_MODEL }}
          TRL_LLM_FALLBACK_MODEL: ${{ vars.TRL_LLM_FALLBACK_MODEL }}
          TRL_LLM_FALLBACK_MODEL_2: ${{ vars.TRL_LLM_FALLBACK_MODEL_2 }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
          TRL_EDGAR_CONTACT: ${{ vars.TRL_EDGAR_CONTACT }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          AZURE_TRANSLATOR_KEY: ${{ secrets.AZURE_TRANSLATOR_KEY }}
          AZURE_TRANSLATOR_REGION: ${{ vars.AZURE_TRANSLATOR_REGION }}
          GOOGLE_TRANSLATE_API_KEY: ${{ secrets.GOOGLE_TRANSLATE_API_KEY }}
          # 入力はシェルに直接展開せず環境変数経由で渡す(スクリプトインジェクション対策)
          SRC_PUBMED: ${{ inputs.src_pubmed }}
          SRC_ARXIV: ${{ inputs.src_arxiv }}
          SRC_GNEWS: ${{ inputs.src_gnews }}
          SRC_PRTIMES: ${{ inputs.src_prtimes }}
          SRC_TRIALS: ${{ inputs.src_trials }}
          SRC_YAHOO: ${{ inputs.src_yahoo }}
          SRC_OPENALEX: ${{ inputs.src_openalex }}
          SRC_EDINET: ${{ inputs.src_edinet }}
          SRC_EDGAR: ${{ inputs.src_edgar }}
          IN_KINDS: ${{ inputs.kinds || 'long' }}
          IN_MAX_EVAL: ${{ github.event_name == 'schedule' && '10' || inputs.max_eval || '5' }}
          IN_RETRY: ${{ inputs.retry_failed || 'no' }}
          IN_PURGE: ${{ inputs.purge_evaluations || 'no' }}
          IN_ONLY_NEW: ${{ inputs.only_new || 'no' }}
          IN_DEPTH_INPUT: ${{ inputs.depth || 'deep' }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            IN_SOURCES="pubmed,arxiv,gnews,prtimes,trials,yahoo,openalex,edinet,edgar"
          else
            IN_SOURCES=""
            [ "$SRC_PUBMED" = "true" ] && IN_SOURCES="$IN_SOURCES,pubmed"
            [ "$SRC_ARXIV" = "true" ] && IN_SOURCES="$IN_SOURCES,arxiv"
            [ "$SRC_GNEWS" = "true" ] && IN_SOURCES="$IN_SOURCES,gnews"
            [ "$SRC_PRTIMES" = "true" ] && IN_SOURCES="$IN_SOURCES,prtimes"
            [ "$SRC_TRIALS" = "true" ] && IN_SOURCES="$IN_SOURCES,trials"
            [ "$SRC_YAHOO" = "true" ] && IN_SOURCES="$IN_SOURCES,yahoo"
            [ "$SRC_OPENALEX" = "true" ] && IN_SOURCES="$IN_SOURCES,openalex"
            [ "$SRC_EDINET" = "true" ] && IN_SOURCES="$IN_SOURCES,edinet"
            [ "$SRC_EDGAR" = "true" ] && IN_SOURCES="$IN_SOURCES,edgar"
            IN_SOURCES="${IN_SOURCES#,}"
          fi
          if [ -z "$IN_SOURCES" ]; then
            echo "::error::No sources selected. Check at least one source."
            exit 1
          fi
          if [ "$IN_PURGE" = "yes" ]; then
            python trl.py purge --data-dir _data --evaluations
          fi
          ONLY_NEW_FLAG=""
          if [ "$IN_ONLY_NEW" = "yes" ]; then ONLY_NEW_FLAG="--only-new"; fi
          # 収集の深さ: 定期実行は火曜 (JST) だけ深い日 (全窓) とし、他の曜日は
          # 浅い日として発見系ソースの窓を数日に切り詰める。手動実行は入力で選ぶ
          IN_DEPTH="$IN_DEPTH_INPUT"
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            IN_DEPTH="deep"
            if [ "$(TZ=Asia/Tokyo date +%u)" != "2" ]; then
              IN_DEPTH="shallow"
            fi
          fi
          python trl.py run --data-dir _data \
            --sources "$IN_SOURCES" \
            --kinds "$IN_KINDS" \
            --max-eval "$IN_MAX_EVAL" \
            --retry-failed "$IN_RETRY" \
            --depth "$IN_DEPTH" \
            $ONLY_NEW_FLAG
      - name: Export site (data.json + web)
        if: always() && hashFiles('_data/trl.sqlite') != ''
        run: python trl.py export --data-dir _data --out _site
      - name: Upload site artifact
        if: always() && hashFiles('_site/data.json') != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Persist data (preserve history)
        if: always()
        env:
          TOKEN: ${{ github.token }}
        run: |
          if [ ! -d _data ]; then
            echo "No data directory to persist"
            exit 0
          fi

          cd _data

          if [ -z "$(ls -A .)" ]; then
            echo "No data to persist"
            exit 0
          fi

          if [ ! -d .git ]; then
            git init -q -b data
            git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi

          git config user.name github-actions
          git config user.email actions@users.noreply.github.com

          git add -A

          if git diff --cached --quiet; then
            echo "No data changes to commit"
            exit 0
          fi

          git commit -q -m "data $(date -u +%FT%TZ)"
          # push の一時的な失敗でその回の収集・評価が失われないよう、3回まで試す
          for i in 1 2 3; do
            if git push -q origin data; then
              exit 0
            fi
            echo "push failed (attempt $i), retrying..."
            sleep 5
          done
          echo "::error::Could not persist data after 3 attempts"
          exit 1

  deploy:
    # Settings -> Pages -> Source を「GitHub Actions」にしておくこと
    needs: run
    if: needs.run.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
