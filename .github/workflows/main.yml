name: TRL pipeline

on:
  workflow_dispatch:
    inputs:
      sources:
        description: "Sources"
        type: choice
        options: ["pubmed,arxiv", "pubmed", "arxiv"]
        default: "pubmed,arxiv"
      kinds:
        description: "Evaluation kinds"
        type: choice
        options: ["long", "event", "long,event"]
        default: "long"
      max_eval:
        description: "Max candidates to evaluate per run"
        type: string
        default: "10"
      retry_failed:
        description: "Retry previously failed evaluations?"
        type: choice
        options: ["no", "yes"]
        default: "no"
  schedule:
    - cron: "17 21 * * 1"   # Mondays 21:17 UTC (Tuesday 06:17 JST)

permissions:
  contents: write

concurrency:
  group: trl-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check required files
        run: python trl.py check-config
      - name: Tests
        run: python -m unittest test_trl -v
      - name: Restore data branch
        run: |
          set +e
          git ls-remote --exit-code --heads origin data >/dev/null 2>&1
          rc=$?
          set -e
          if [ $rc -eq 0 ]; then
            git clone -q --depth 1 --branch data "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" _data
            rm -rf _data/.git
          elif [ $rc -eq 2 ]; then
            mkdir -p _data
          else
            echo "::error::Could not check data branch (rc=$rc). Aborting to protect data"
            exit 1
          fi
      - name: Run pipeline
        env:
          TRL_LLM_PROVIDER: ${{ vars.TRL_LLM_PROVIDER }}
          TRL_LLM_MODEL: ${{ vars.TRL_LLM_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: |
          python trl.py run --data-dir _data \
            --sources "${{ inputs.sources || 'pubmed,arxiv' }}" \
            --kinds "${{ inputs.kinds || 'long' }}" \
            --max-eval "${{ inputs.max_eval || '10' }}" \
            --retry-failed "${{ inputs.retry_failed || 'no' }}"
      - name: Persist data (single commit to data branch)
        if: always()
        run: |
          cd _data
          [ -n "$(ls -A .)" ] || exit 0
          git init -q -b data
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -q -m "data $(date -u +%FT%TZ)"
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -q --force origin data
