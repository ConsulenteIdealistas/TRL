name: TRL pipeline

on:
  workflow_dispatch:
    inputs:
      sources:
        description: "情報源"
        type: choice
        options: ["pubmed,arxiv", "pubmed", "arxiv"]
        default: "pubmed,arxiv"
      kinds:
        description: "評価の種類"
        type: choice
        options: ["long", "event", "long,event"]
        default: "long"
      max_eval:
        description: "1回で評価する最大件数"
        type: string
        default: "10"
  schedule:
    - cron: "17 21 * * 1"   # 毎週月曜 21:17 UTC (日本時間 火曜 06:17)

permissions:
  contents: write

concurrency:
  group: trl-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap from bundle.zip (初回のみ)
        run: |
          if [ -f bundle.zip ]; then
            unzip -o -q bundle.zip -x '.github/*' '__MACOSX/*'
            rm bundle.zip
            git add -A
            git -c user.name=github-actions -c user.email=actions@users.noreply.github.com \
              commit -q -m "Bootstrap project from bundle.zip"
            git push -q
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit / integration tests
        run: python -m unittest discover -s tests -t . -v

      - name: Restore data branch
        run: |
          set +e
          git ls-remote --exit-code --heads origin data >/dev/null 2>&1
          rc=$?
          set -e
          if [ $rc -eq 0 ]; then
            git clone -q --depth 1 --branch data "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" _data
            rm -rf _data/.git
          elif [ $rc -eq 2 ]; then
            mkdir -p _data
          else
            echo "::error::dataブランチの存在確認に失敗(rc=$rc)。データ保護のため中断します"
            exit 1
          fi

      - name: Run pipeline
        env:
          TRL_LLM_PROVIDER: ${{ vars.TRL_LLM_PROVIDER }}
          TRL_LLM_MODEL: ${{ vars.TRL_LLM_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: |
          python -m trl run --data-dir _data \
            --sources "${{ inputs.sources || 'pubmed,arxiv' }}" \
            --kinds "${{ inputs.kinds || 'long' }}" \
            --max-eval "${{ inputs.max_eval || '10' }}"

      - name: Persist data (単一コミットをdataブランチへ)
        if: always()
        run: |
          cd _data
          [ -n "$(ls -A .)" ] || exit 0
          git init -q -b data
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -q -m "data $(date -u +%FT%TZ)"
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -q --force origin data
