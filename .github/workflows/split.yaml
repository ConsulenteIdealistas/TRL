name: Split trl.py (one-shot)

# 手動実行専用。trl.py を trlcore/ に機械分割し、テストが通った場合だけ
# ブランチ split-modules に push する。main には触らない(PRで確認してマージ)。
on: workflow_dispatch

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests (before)
        run: python -m unittest test_trl test_entities test_site

      - name: Split
        run: python tools/split_trl.py

      - name: Lint (undefined names)
        run: |
          pip install pyflakes
          python -m pyflakes trlcore | tee /tmp/flakes.txt || true
          ! grep -E "undefined name|unable to detect" /tmp/flakes.txt

      - name: Tests (after)
        run: python -m unittest test_trl test_entities test_site -v

      - name: Push branch
        run: |
          find . -name __pycache__ -type d -prune -exec rm -rf {} +
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git switch -c split-modules
          git add -A -- trlcore trl.py tools
          git commit -q -m "refactor: trl.py を trlcore/ に機械分割(挙動変更なし)"
          git push --force origin split-modules
