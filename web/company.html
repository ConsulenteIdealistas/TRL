.lrow .lt a{color:inherit}
.lrow .lm{color:var(--sub);font-size:12px;margin-top:3px}
table.rt{width:100%;border-collapse:collapse;font-size:12.5px;margin:0 0 8px}
table.rt th,table.rt td{border:1px solid var(--line);padding:6px 8px;text-align:right;white-space:nowrap}
