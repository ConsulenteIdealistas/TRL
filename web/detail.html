<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>詳細 — TRL Explorer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar"><a class="brand" href="index.html"><span class="mark">T</span><span>TRL<span class="light"> Explorer</span></span></a><div class="meta"><span class="dot"></span>Research Intelligence</div></header>
<main class="ws">
<p style="margin:0 0 12px"><a class="tg" href="index.html">← 一覧に戻る</a></p>
<section class="panel"><div id="det"><div class="ph"><i>⌕</i><h3>読み込み中…</h3></div></div></section>
<footer class="ft"><span>TRL Explorer</span><span>技術成熟度と事業化評価は独立した評価軸です。スコアは評価尺度であり、株価上昇確率・成功確率・投資利益率ではありません。</span></footer>
</main>
<script>
"use strict";
/* 詳細ページ: data.json から ?id= の候補を1件だけ表示する。一覧(app.js)と同じ値をそのまま表示し、再計算しない。 */
const SL = {final: "選定可能", review: "要追加調査", hold: "保留", pending: "未評価", error: "エラー", rejected: "除外"};
const IL = {technology_readiness: "技術成熟度", technological_advantage: "技術的優位性", monetization: "収益化能力",
  market_growth: "市場成長性", financial_sustainability: "財務的持続可能性", moat_durability: "競争優位性の持続性",
  catalyst_quality: "触媒の質", expectation_gap: "期待ギャップ", not_priced_in: "未織り込み度",
  timing_feasibility: "タイミングの実現性", supply_demand: "需給", downside_resilience: "下値耐性"};
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const safeUrl = u => /^https?:\/\//i.test(String(u || "")) ? String(u) : "#";
const ok = t => Number.isInteger(t) && t >= 1 && t <= 9;
const SRC_CLASS = {arxiv: "s-arxiv", pubmed: "s-pubmed", gnews: "s-gnews", prtimes: "s-prtimes", trials: "s-trials", edinet: "s-edinet", yahoo: "s-yahoo"};
const SRC_LABEL = {arxiv: "arXiv", pubmed: "PubMed", gnews: "News", prtimes: "PR TIMES", trials: "ClinicalTrials", edinet: "EDINET", yahoo: "Yahoo Finance"};
const label = k => IL[k] || k;
const DL = {positive: "ポジティブ", negative: "ネガティブ", mixed: "混在"};
const dirB = ev => { const d = ev && ev.direction; return d && d.direction ? `<span class="dir dir-${d.direction}">${DL[d.direction]}</span>` : ""; };
const jst = iso => { try { return new Date(iso).toLocaleString("ja-JP", {timeZone: "Asia/Tokyo", hour12: false}); } catch (e) { return iso; } };

function trl(t) {
  const k = ok(t);
  return `<div class="det"><div class="num ${k ? "" : "u"}"><span>TRL</span><strong>${k ? t : "未確定"}</strong></div><div class="track">${
    Array.from({length: 9}, (_, i) => `<span class="seg ${k && i < t ? "f" : ""}"></span>`).join("")}</div></div>`;
}
function scoreRow(k, it) {
  const v = it ? it.score : null;
  const why = it && it.reason ? `<p>${esc(it.reason)}</p>` : "";
  const miss = it && v == null && it.missing_info.length ? `<p class="m">不足: ${it.missing_info.map(esc).join(" / ")}</p>` : "";
  const ev = it && it.evidence.length ? `<ul class="pts">${it.evidence.map(e => `<li><b>✓</b><span>${e.ref ? `<a href="${esc(safeUrl(e.ref))}" target="_blank" rel="noopener noreferrer">${esc(e.summary || e.ref)}</a>` : esc(e.summary)}</span></li>`).join("")}</ul>` : "";
  const ce = it && it.counter_evidence.length ? `<p class="m">反証: ${it.counter_evidence.map(esc).join(" / ")}</p>` : "";
  return `<div class="sc"><div class="h"><span>${esc(label(k))}</span><span class="${v == null ? "u" : ""}">${v == null ? "未算出" : v + " / 100"}</span></div><div class="bar"><i style="width:${v == null ? 0 : Math.max(0, Math.min(100, v))}%"></i></div>${why}${miss}${ev}${ce}</div>`;
}
const pts = (a, w) => a.length ? `<ul class="pts">${a.map(x => `<li><b class="${w ? "w" : ""}">${w ? "!" : "✓"}</b><span>${esc(x)}</span></li>`).join("")}</ul>` : `<p class="hint">登録された情報はありません。</p>`;
function getNote(id) { try { return localStorage.getItem("trl-note:" + id) || ""; } catch (e) { return ""; } }
function setNote(id, v) { try { localStorage.setItem("trl-note:" + id, v); return true; } catch (e) { return false; } }

async function load() {
  const id = new URLSearchParams(location.search).get("id");
  let d;
  try {
    const res = await fetch("data.json", {cache: "no-cache"});
    if (!res.ok) throw new Error("HTTP " + res.status);
    d = await res.json();
  } catch (e) {
    $("#det").innerHTML = `<div class="ph"><i>!</i><h3>data.json を読み込めません</h3><p class="hint">実行(Run workflow)が完了し、ページが配備されているか確認してください。</p></div>`;
    return;
  }
  const p = (d.candidates || []).find(x => x.id === id);
  if (!p) {
    $("#det").innerHTML = `<div class="ph"><i>⌕</i><h3>対象の論文が見つかりません</h3><p class="hint">一覧に戻って選び直してください。</p></div>`;
    return;
  }
  document.title = p.title + " — TRL Explorer";
  const G = d.config.item_groups;
  const LL = p.long && p.long.status !== "error" ? p.long : null;
  const EV = p.event && p.event.status !== "error" ? p.event : null;
  const tr = LL && LL.trl_level;
  const lvl = tr ? tr.level : null;
  const strong = p.entities.filter(e => e.strength === "strong");
  const missAll = LL ? [...new Set(Object.values(LL.items).flatMap(i => i.missing_info))] : [];
  const q = p.queue && p.queue.long;
  const total = LL && LL.total != null ? `${LL.total} / 100(${esc(LL.band || "")})` : "未確定";
  const news = (p.related_news || []).map(n => `<li><span class="org ${n.origin === "企業発表" ? "org-p" : ""}">${esc(n.origin || "報道")}</span><span class="date">${esc(n.published || "")}</span><a href="${esc(safeUrl(n.url))}" target="_blank" rel="noopener noreferrer">${esc(n.title)}</a>${n.media ? `<span class="date">${esc(n.media)}</span>` : ""}</li>`).join("");
  const fins = (p.related_financials || []).map(f => `<li><span class="date">${esc(f.published || "")}</span><a href="${esc(safeUrl(f.url))}" target="_blank" rel="noopener noreferrer">${esc(f.title)}</a><p style="margin:4px 0 0">${esc(f.text || "")}</p></li>`).join("");
  $("#det").innerHTML = `<div class="dc"><header class="dh"><div class="top"><span class="badge ${SRC_CLASS[p.source] || ""}">${esc(SRC_LABEL[p.source] || p.source)}</span><span class="st ${p.display_status === "final" ? "" : "st-" + p.display_status}">${esc(SL[p.display_status] || p.display_status)}</span>${dirB(p.long)}</div><h3>${esc(p.title)}</h3><div class="mi"><span>公開日 ${esc(p.published || "—")}</span>${LL ? `<span>評価日 ${esc(jst(LL.evaluated_at))}</span>` : ""}</div></header>
<section class="ds"><h4>研究概要</h4><p>${esc(p.abstract) || "（要旨なし）"}</p>${(p.fields || []).length ? `<div class="tags" style="margin-top:8px">${p.fields.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>` : ""}</section>
<section class="ds"><h4>技術成熟度（TRL）</h4>${trl(lvl)}${tr && tr.reason ? `<p>${esc(tr.reason)}</p>` : ""}${tr && tr.level == null && tr.missing_info.length ? `<p class="hint">不足: ${tr.missing_info.map(esc).join(" / ")}</p>` : ""}<p class="hint">TRLは資料から根拠付きで判断できた場合のみ表示します。技術成熟度スコアからの換算はしません。</p></section>
<section class="ds"><h4>技術評価</h4>${LL ? G.technology.map(k => scoreRow(k, LL.items[k])).join("") : `<p class="hint">未評価です。</p>`}</section>
<section class="ds"><h4>事業評価</h4>${LL && LL.business_stage === "pre_stage" ? `<p class="note">この技術は前商業段階(TRL 3以下)のため、事業項目は「段階未達」として不足とは区別しています。点が付いている項目はそのまま表示します。</p>` : ""}${LL ? G.business.map(k => scoreRow(k, LL.items[k])).join("") : `<p class="hint">未評価です。</p>`}${LL && !strong.length ? `<p class="note">関連企業が特定できていないため、企業固有の項目は算出されません。総合点は6項目すべてが揃うまで確定せず、重みの再配分もしません。</p>` : ""}</section>
${EV ? `<section class="ds"><h4>イベント評価</h4>${Object.keys(EV.items).map(k => scoreRow(k, EV.items[k])).join("")}<p>総合点 ${EV.total != null ? EV.total + " / 100(" + esc(EV.band || "") + ")" : "未確定"}</p></section>` : ""}
<section class="ds"><h4>総合点（長期）</h4><p>${total}</p>${LL && LL.total_scope === "technology" ? `<p class="note">これは技術評価の総合点です。事業項目は段階未達のため対象外で、技術軸の項目だけで算出しています。</p>` : ""}</section>
<section class="ds"><h4>材料の方向性</h4>${LL && LL.direction ? `<p>${dirB(LL)} ${esc(LL.direction.reason || "")}</p><p class="hint">方向性は点数やTRLとは独立に、資料が示す出来事の追い風・逆風を判定したものです。</p>` : `<p class="hint">未判定です（方向を決める出来事が資料に無いか、旧基準の評価です）。</p>`}</section>
<section class="ds"><h4>不足している観点</h4>${LL && LL.critical_missing.length ? `<p class="m" style="color:#a96500;font-weight:700">必須項目の不足: ${LL.critical_missing.map(k => esc(label(k))).join("、")}</p>` : ""}${pts(missAll, 1)}${q && q.next_sources.length ? `<p class="hint">次に確認する情報源: ${q.next_sources.map(esc).join(" / ")}</p>` : ""}${q && q.reeval_conditions.length ? `<p class="hint">再評価の条件: ${q.reeval_conditions.map(esc).join(" / ")}</p>` : ""}</section>
${p.display_status === "error" && p.long && p.long.errors.length ? `<section class="ds"><h4>処理上の注意</h4>${pts(p.long.errors, 1)}</section>` : ""}
<section class="ds"><h4>関連事業ニュース（評価に同梱した根拠プール）</h4>${news ? `<ul class="news">${news}</ul>` : `<p class="hint">同梱されたニュースはありません。</p>`}</section>
<section class="ds"><h4>関連財務根拠（開示資料の財務数値）</h4>${fins ? `<ul class="news">${fins}</ul>` : `<p class="hint">同梱された財務根拠はありません。</p>`}</section>
<section class="ds"><h4>関連企業</h4>${p.entities.map(e => `<span class="chip">${esc(e.name)}${e.product_name ? "（" + esc(e.product_name) + "）" : ""} ${e.strength === "strong" ? "" : "・弱"}</span>`).join("") || '<span class="hint">関連企業は未特定です。</span>'}</section>
<section class="ds"><h4>調査メモ</h4><textarea id="note" aria-label="調査メモ" placeholder="仮説、確認したい点、次の調査などを記録...">${esc(getNote(p.id))}</textarea><div class="acts"><button class="btn sec" type="button" id="save">メモを保存</button><a class="btn src" href="${esc(safeUrl(p.url))}" target="_blank" rel="noopener noreferrer">原文サイトを開く ↗</a></div><p id="msg" class="hint" aria-live="polite">メモはこの端末のブラウザにだけ保存されます。</p></section></div>`;
  $("#save").addEventListener("click", () => {
    const saved = setNote(p.id, $("#note").value);
    $("#msg").textContent = saved ? "この端末のブラウザに保存しました。" : "保存できませんでした(ブラウザの保存機能が無効の可能性があります)。";
  });
}
load();
</script>
</body>
</html>
