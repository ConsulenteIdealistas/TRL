<html lang="ja">
<head>
<meta charset="UTF-8">

<script>try{var tt=localStorage.getItem("trl-theme");document.documentElement.dataset.theme=(tt==="light"||tt==="dark")?tt:"dark";}catch(e){document.documentElement.dataset.theme="dark";}</script>
<style>
/* 競合比較 (同じタグの企業) 専用。共通クラスは style.css の流儀に合わせる */
.pctl{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin:0 0 8px;font-size:12px;color:var(--sub)}
.pctl select{min-height:34px;padding:4px 8px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:inherit}
.peerBox{margin:0 0 10px;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--field)}
.peerBox summary{cursor:pointer;font-size:12px;font-weight:750}
.peerBox .tn{color:var(--gd);font-weight:700;margin-left:6px}
.peerIn{margin-top:8px}
.peerIn summary{cursor:pointer;font-size:12px;font-weight:700;color:var(--gd)}

<body>

<p style="margin:0 0 12px"><a class="tg" href="index.html">← 一覧に戻る</a> <button id="lt" class="btn quiet" type="button" style="float:right">日本語訳で表示</button></p>
<section class="panel"><div id="det"><div class="ph"><i>⌕</i><h3>読み込み中…</h3></div></div></section>
<footer class="ft"><span>TRL Explorer</span><span><a href="criteria.html">採点基準（評価規程と重み）</a></span><span><a href="audit.html">監査（要確認の処分）</a></span><span>技術成熟度と事業化評価は独立した評価軸です。スコアは評価尺度であり、株価上昇確率・成功確率・投資利益率ではありません。</span></footer>
</main>
<script>
"use strict";
/* 詳細ページ: data.json から ?id= の候補を1件だけ表示する。一覧(app.js)と同じ値をそのまま表示し、再計算しない。 */
const SL = {final: "選定可能", review: "要追加調査", hold: "保留", pending: "未評価", error: "エラー", rejected: "除外"};
const SR = {abstract_too_short: "要旨が短いため評価対象外", published_after_as_of: "実行基準日より後の公表のため対象外"};  // 除外 (screening) の理由
const IL = {technology_readiness: "技術成熟度", technological_advantage: "技術的優位性", monetization: "収益化能力",
  market_growth: "市場成長性", financial_sustainability: "財務的持続可能性", moat_durability: "競争優位性の持続性",
  management_execution: "経営陣・実行力",
  catalyst_quality: "触媒の質", expectation_gap: "期待ギャップ", not_priced_in: "未織り込み度",
  timing_feasibility: "タイミングの実現性", supply_demand: "需給", downside_resilience: "下値耐性"};
const $ = s => document.querySelector(s);
let LANG = "ja";
try { LANG = localStorage.getItem("trl-lang") || "ja"; } catch (e) { /* 既定のまま */ }
const dispT = p => LANG === "ja" && p.title_ja ? p.title_ja : p.title;
const dispA = p => LANG === "ja" && p.abstract_ja ? p.abstract_ja : p.abstract || "";
const TR_SRC = {deepl: "DeepL", azure: "Azure", google: "Google", llm: "LLM"};
const srcOf = p => { const s = p.translation_src || {}; const used = [...new Set([p.title_ja ? s.title : null, p.abstract_ja ? s.abstract : null].filter(Boolean))]; return used.map(v => TR_SRC[v] || v).join(" / "); };
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const safeUrl = u => /^https?:\/\//i.test(String(u || "")) ? String(u) : "#";
const ok = t => Number.isInteger(t) && t >= 1 && t <= 9;
const SRC_CLASS = {arxiv: "s-arxiv", pubmed: "s-pubmed", gnews: "s-gnews", prtimes: "s-prtimes", trials: "s-trials", edinet: "s-edinet", yahoo: "s-yahoo", openalex: "s-openalex", edgar: "s-edgar"};
const SRC_LABEL = {arxiv: "arXiv", pubmed: "PubMed", gnews: "News", prtimes: "PR TIMES", trials: "ClinicalTrials", edinet: "EDINET", yahoo: "Yahoo Finance", openalex: "OpenAlex", edgar: "SEC EDGAR", roic: "ROIC.ai"};
const ML = {JP: "日本", US: "米国", GB: "英国", CH: "スイス", DE: "ドイツ", DK: "デンマーク", SE: "スウェーデン", IT: "イタリア", CA: "カナダ", AU: "オーストラリア", ES: "スペイン", FR: "フランス", NL: "オランダ", FI: "フィンランド", NO: "ノルウェー", BE: "ベルギー", IN: "インド", SG: "シンガポール", NZ: "ニュージーランド", PL: "ポーランド", AT: "オーストリア", TW: "台湾", HK: "香港", IE: "アイルランド", PT: "ポルトガル", CZ: "チェコ", GR: "ギリシャ"};
const CL = {space: "宇宙", bio: "バイオ", semiconductor: "半導体", ai: "AI", robotics: "ロボティクス", energy: "エネルギー・蓄電池", quantum: "量子技術", defense: "防衛"};
const TL = {photonics: "フォトニクス", medtech: "医療機器", earth_observation: "地球観測", constellation: "衛星コンステレーション", space_transport: "宇宙輸送", lunar: "月面開発", debris_removal: "デブリ除去", mrna: "mRNA", cell_therapy: "細胞治療", gene_therapy: "遺伝子治療・ゲノム編集", antibody: "抗体医薬", radiopharm: "放射性医薬品", vaccine: "ワクチン", regenerative_medicine: "再生医療", diagnostics: "診断", drug_ai: "創薬AI", surgical_robot: "手術ロボット", power_semi: "パワー半導体", advanced_packaging: "先端パッケージング", memory: "メモリ", semi_equipment: "半導体製造装置", ai_infra: "AIインフラ・データセンター", voice_ai: "音声AI", industrial_robotics: "産業用ロボット・自動化", warehouse_automation: "倉庫・物流自動化", autonomous_mobility: "自律移動・ドローン", humanoid: "ヒューマノイド", hydrogen: "水素・燃料電池", ess: "蓄電・ESS", ev_charging: "EV充電", solid_state_battery: "全固体電池", battery_materials: "電池材料", perovskite: "ペロブスカイト太陽電池", fusion: "核融合", smr: "SMR", quantum_computing: "量子コンピュータ", quantum_comm: "量子通信・暗号", quantum_sensing: "量子センシング"};
const STG = {rd: "研究開発型", demo: "実証型", production: "量産型", commercial: "商業化型"};
// 導出 tier (tiers/v1) の表示名。W-1 で Core も含め全層を対称に併記する。
// export に無い古い data.json では基礎 tier から読み替える
// (watch → Look、reference → See、それ以外は Core)
const DTL = {core: "Core", conditional: "Conditional", look: "Look", see: "See"};
const dtierOf = e => e.derived_tier || (e.tier === "watch" ? "look" : e.tier === "reference" ? "see" : "core");
const dtLabel = e => DTL[dtierOf(e)] || "";
// Conditional は層名に未充足の理由 (導出の detail 文そのまま) を併記する (W-2)
const dtText = e => {
  const l = dtLabel(e);
  if (!l || dtierOf(e) !== "conditional") return l;
  const rs = (e.derived_reasons || []).filter(Boolean);
  return rs.length ? `Conditional（${rs.join("／")}）` : l;
};
const tagLabel = t => CL[t] || TL[t] || t;
const label = k => IL[k] || k;
const DL = {positive: "ポジティブ", negative: "ネガティブ", mixed: "混在"};
const dirB = ev => { const d = ev && ev.status !== "error" && ev.direction; return d && d.direction ? `<span class="dir dir-${d.direction}">${DL[d.direction]}</span>` : ""; };  // error 評価の方向性は出さない (一覧側と揃える)
const jst = iso => { try { return new Date(iso).toLocaleString("ja-JP", {timeZone: "Asia/Tokyo", hour12: false}); } catch (e) { return iso; } };
function holdCauseTxt(ev) {
  // 保留の主因 (export 側で項目の理由文から切り分けたもの) の説明文
  if (!ev || ev.status !== "hold" || !ev.hold_cause) return "";
  return ev.hold_cause === "unidentified"
    ? "保留の主因: 対象企業を資料から一意に特定できないため、企業固有の項目が算出できませんでした。"
    : "保留の主因: 対象企業は特定できていますが、必須項目の根拠が資料にありませんでした。";
}
function prevCmp(ev, curTrl) {
  // 前回比較: 前回の日時・状態と、TRL・総合点・項目点の変化 (一覧のドロワーと共通の形)
  const pv = ev.prev;
  if (!pv) return "";
  const parts = [];
  if (pv.trl_level != null || curTrl != null) {
    // TRL の昇降だけは色と矢印で示す (総合点は良い悪いの含みを持たせないため無色)
    const moved = pv.trl_level != null && curTrl != null && pv.trl_level !== curTrl;
    const cls = moved ? (curTrl > pv.trl_level ? "td-up" : "td-dn") : "";
    parts.push(`<span class="${cls}">TRL ${pv.trl_level ?? "未確定"} → ${curTrl ?? "未確定"}${moved ? (curTrl > pv.trl_level ? "↑" : "↓") : ""}</span>`);
  }
  if (pv.total != null || ev.total != null) parts.push(esc(`総合点 ${pv.total ?? "未確定"} → ${ev.total ?? "未確定"}`));
  const diffs = Object.keys(ev.items).filter(k => k in pv.items && pv.items[k] !== ev.items[k].score)
    .map(k => `${label(k)}: ${pv.items[k] ?? "—"} → ${ev.items[k].score ?? "—"}`);
  return `<p class="hint">前回評価: ${esc(jst(pv.evaluated_at))}（${esc(SL[pv.status] || pv.status)}）</p>`
    + (parts.length ? `<p>${parts.join(" / ")}</p>` : "")
    + (diffs.length ? `<ul class="pts">${diffs.map(d => `<li><b>→</b><span>${esc(d)}</span></li>`).join("")}</ul>`
      : `<p class="hint">項目点に変化はありません。</p>`);
}

function trl(t) {
  const k = ok(t);
  return `<div class="det"><div class="num ${k ? "" : "u"}"><span>TRL</span><strong>${k ? t : "未確定"}</strong></div><div class="track">${
    Array.from({length: 9}, (_, i) => `<span class="seg ${k && i < t ? "f" : ""}"></span>`).join("")}</div></div>`;
}
function scoreRow(k, it) {
  const v = it && typeof it.score === "number" && isFinite(it.score) ? it.score : null;
  const why = it && it.reason ? `<p>${esc(it.reason)}</p>` : "";
  const miss = it && v == null && it.missing_info.length ? `<p class="m">不足: ${it.missing_info.map(esc).join(" / ")}</p>` : "";
  const wait = it && it.awaiting_info && it.awaiting_info.length ? `<p class="w2">結果待ち: ${it.awaiting_info.map(esc).join(" / ")}</p>` : "";
  const ev = it && it.evidence.length ? `<ul class="pts">${it.evidence.map(e => { const ref = e.ref && e.ref.includes("news.google.com") ? "https://www.google.com/search?q=" + encodeURIComponent(e.summary || "") : e.ref; return `<li><b>✓</b><span>${ref ? `<a href="${esc(safeUrl(ref))}" target="_blank" rel="noopener noreferrer">${esc(e.summary || ref)}</a>` : esc(e.summary)}</span></li>`; }).join("")}</ul>` : "";
  const ce = it && it.counter_evidence.length ? `<p class="m">反証: ${it.counter_evidence.map(esc).join(" / ")}</p>` : "";
  return `<div class="sc"><div class="h"><span>${esc(label(k))}</span><span class="${v == null ? "u" : ""}">${v == null ? "未算出" : v + " / 100"}</span></div><div class="bar"><i style="width:${v == null ? 0 : Math.max(0, Math.min(100, v))}%"></i></div>${why}${miss}${wait}${ev}${ce}</div>`;
}
const pts = (a, w) => a.length ? `<ul class="pts">${a.map(x => `<li><b class="${w ? "w" : ""}">${w ? "!" : "✓"}</b><span>${esc(x)}</span></li>`).join("")}</ul>` : `<p class="hint">登録された情報はありません。</p>`;
async function copyText(t, btn) {
  // ブラウザ内だけで完結するコピー。Clipboard API が使えない環境では
  // 一時テキストエリア経由にフォールバックする
  let ok = false;
  try { await navigator.clipboard.writeText(t); ok = true; } catch (e) {}
  if (!ok) {
    const ta = document.createElement("textarea");
    ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { ok = document.execCommand("copy"); } catch (e) {}
    ta.remove();
  }
  if (btn) { const o = btn.textContent; btn.textContent = ok ? "コピーしました" : "コピーできませんでした"; setTimeout(() => { btn.textContent = o; }, 1600); }
}
function copyBuilt(build, btn) {
  // テキスト生成側が例外を投げても無反応にならないよう、生成に失敗したら失敗表示だけは出す
  let t;
  try { t = build(); } catch (e) { if (btn) { const o = btn.textContent; btn.textContent = "コピーできませんでした"; setTimeout(() => { btn.textContent = o; }, 1600); } return; }
  copyText(t, btn);
}
function getNote(id) { try { return localStorage.getItem("trl-note:" + id) || ""; } catch (e) { return ""; } }
let noteDraft = null;
function setNote(id, v) { try { localStorage.setItem("trl-note:" + id, v); return true; } catch (e) { return false; } }

/* ===== 競合比較 (表示専用) =====
   タグをピア集合として、同じタグの企業を横並びにする。stage・tags と同じ表示層で、
   採点・選定・必須判定には使わない。入力は data.json の既存フィールドだけ
   (export・スキーマは変更しない)。
   比較の単位は候補 (記事) ではなく企業。企業ごとに、強リンク候補の最新の
   long 評価1件へ集約する。弱リンクは「言及されただけ」なので評価の帰属には
   使わない (企業固有の項目が算出されるのは強リンクのとき、という本体の扱いに揃える)。 */
let peerSortKey = "total";
let peerShowWatch = false;

function peerRegistry(d) {
  // 企業台帳: entity_id → {企業情報, 最新の long 評価, 代表候補}
  // Look・See 企業は candidates にほぼ現れないため watch_companies からも取り込む
  const byId = new Map();
  const put = (id, info) => {
    if (!id) return null;
    let c = byId.get(id);
    if (!c) {
      c = {entity_id: id, name: info.name || id, market: info.market || "JP",
        sector: info.sector || null, tags: Array.isArray(info.tags) ? info.tags : [],
        stage: info.stage || null, tier: info.tier || "core",
        derived_tier: info.derived_tier || null,
        derived_reasons: Array.isArray(info.derived_reasons) ? info.derived_reasons : [],
        long: null, status: null, cand: null, repCand: null, repKey: ""};
      byId.set(id, c);
    }
    return c;
  };
  for (const w of d.watch_companies || []) put(w.id, w);
  for (const p of d.candidates || []) {
    for (const e of p.entities || []) {
      const c = put(e.entity_id, e);
      if (!c || e.strength !== "strong") continue;
      // 代表候補 (詳細へのリンク先): 評価が無い企業でも強リンクの最新候補へ辿れるようにする
      const pk = (p.published || "") + " " + p.id;
      if (!c.repCand || pk > c.repKey) { c.repCand = p.id; c.repKey = pk; }
      const ev = p.long;
      if (!ev || ev.status === "error") continue;  // error 評価は本体でも「評価なし」扱い
      if (!c.long || (ev.evaluated_at || ev.as_of || "") >= (c.long.evaluated_at || c.long.as_of || "")) {
        c.long = ev;
        c.status = p.display_status || null;
        c.cand = p.id;
      }
    }
  }
  return byId;
}

function peerRow(c, selfIds) {
  // 台帳の1企業を比較表の1行へ。数値 (TRL・総合点・バンド) は final の評価だけに出す
  const fin = c.long && c.long.status === "final";
  return {
    entity_id: c.entity_id, name: c.name, market: c.market, sector: c.sector,
    stage: c.stage, tier: c.tier || "core", derived_tier: c.derived_tier || null,
    derived_reasons: c.derived_reasons || [],
    self: selfIds.has(c.entity_id),
    trl: fin && c.long.trl_level ? c.long.trl_level.level : null,
    total: fin && typeof c.long.total === "number" ? c.long.total : null,
    band: fin ? (c.long.band || null) : null,
    date: c.long ? (c.long.evaluated_at || c.long.as_of || null) : null,
    status: c.long ? (c.status || c.long.status) : null,
    cand: c.cand || c.repCand,
  };
}

function sortPeerRows(rows, key) {
  const byName = (a, b) => a.name.localeCompare(b.name, "ja");
  const dateDesc = (a, b) => String(b.date || "").localeCompare(String(a.date || "")) || byName(a, b);
  const out = [...rows];
  if (key === "name") out.sort(byName);
  else if (key === "date") out.sort(dateDesc);  // 日付なし (空文字) は末尾に落ちる
  else if (key === "trl") out.sort((a, b) =>
    (a.trl != null ? 0 : 1) - (b.trl != null ? 0 : 1) ||
    (b.trl || 0) - (a.trl || 0) || (b.total || 0) - (a.total || 0) || byName(a, b));
  else out.sort((a, b) =>  // 既定は総合点の降順。final 以外は評価日の新しい順に後ろへ続ける
    (a.total != null ? 0 : 1) - (b.total != null ? 0 : 1) ||
    (b.total || 0) - (a.total || 0) || dateDesc(a, b));
  return out;
}

function peerTableHtml(rows) {
  const head = `<tr><th>企業名</th><th>市場・セクター</th><th>TRL</th><th>総合点</th><th>バンド</th><th>段階</th><th>最終評価日</th><th>状態</th></tr>`;
  const body = rows.map(r => {
    const name = r.cand ? `<a href="detail.html?id=${encodeURIComponent(r.cand)}">${esc(r.name)}</a>` : esc(r.name);
    const self = r.self ? `<span class="pself">この企業</span>` : "";
    const crs = (r.derived_reasons || []).filter(Boolean);
    const cond = r.derived_tier === "conditional"
      ? `<span class="hint">（Conditional${crs.length ? ": " + esc(crs.join("／")) : ""}）</span>` : "";
    // Look・See は評価対象外 (単独材料は評価されない)。無いことを不足と同一視しない
    const off = r.tier !== "core" && r.total == null
      ? (r.tier === "reference" ? "評価対象外（See）" : "評価対象外（Look）") : null;
    const trlCell = off ? `<span class="hint">${off}</span>`
      : (r.total != null ? (r.trl != null ? String(r.trl) : "未確定") : "—");
    const totCell = off ? `<span class="hint">${off}</span>`
      : (r.total != null ? String(r.total) : "—");
    const stCell = r.status
      ? `<span class="st ${r.status === "final" ? "st-final" : "st-" + r.status}">${esc(SL[r.status] || r.status)}</span>`
      : `<span class="hint">${off || "未評価"}</span>`;
    return `<tr${r.self ? ' class="self"' : ""}><td>${name}${self}${cond}</td>`
      + `<td>${esc(ML[r.market] || r.market)}・${esc(r.sector ? (CL[r.sector] || r.sector) : "—")}</td>`
      + `<td>${trlCell}</td><td>${totCell}</td><td>${esc(r.band || "—")}</td>`
      + `<td>${esc(r.stage ? (STG[r.stage] || r.stage) : "—")}</td>`
      + `<td>${esc(r.date ? String(r.date).slice(0, 10) : "—")}</td><td>${stCell}</td></tr>`;
  }).join("");
  return `<div class="ptblwrap"><table class="ptbl"><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
}

function renderPeers(d, p) {
  const el = $("#peers");
  if (!el) return;
  const reg = peerRegistry(d);
  const strong = (p.entities || []).filter(e => e.strength === "strong");
  const selfIds = new Set(strong.map(e => e.entity_id));
  const vis = rows => rows.filter(r => peerShowWatch || r.tier === "core" || r.self);
  const parts = [`<div class="pctl"><label><input type="checkbox" id="peerWatch"${peerShowWatch ? " checked" : ""}> Look・See を含める</label>`
    + `<label>並び順 <select id="peerSort">${[["total", "総合点"], ["trl", "TRL"], ["date", "最終評価日"], ["name", "企業名"]].map(([v, l]) => `<option value="${v}"${peerSortKey === v ? " selected" : ""}>${l}</option>`).join("")}</select></label></div>`
    + `<p class="hint">同じタグの企業を横並びにした表示専用の比較です（採点には使っていません）。総合点・TRL は final の評価だけに出し、空欄は「評価なし」であって 0点ではありません。</p>`];
  const seenTags = new Set();
  let first = true;
  for (const e of strong) {
    const selfEnt = reg.get(e.entity_id);
    for (const t of (selfEnt && selfEnt.tags) || e.tags || []) {
      if (seenTags.has(t)) continue;
      seenTags.add(t);
      const all = [...reg.values()].filter(c => (c.tags || []).includes(t)).map(c => peerRow(c, selfIds));
      const others = all.filter(r => !r.self);
      if (!others.length) {
        // 1社だけのタグ: 比較相手がいないことを明示し、代替として sector 単位の集合を出す
        let fb = "";
        if (selfEnt && selfEnt.sector) {
          const srows = sortPeerRows(vis([...reg.values()].filter(c => c.sector === selfEnt.sector).map(c => peerRow(c, selfIds))), peerSortKey);
          fb = `<details class="peerIn"><summary>同じセクター（${esc(CL[selfEnt.sector] || selfEnt.sector)}）の企業を見る</summary>${peerTableHtml(srows)}</details>`;
        }
        parts.push(`<div class="peerBox"><p style="margin:0"><b>${esc(tagLabel(t))}</b></p><p class="hint">このタグを持つ企業は他にいません（比較相手がいません）。</p>${fb}</div>`);
        continue;
      }
      const rows = sortPeerRows(vis(all), peerSortKey);
      if (!rows.some(r => !r.self)) {
        parts.push(`<div class="peerBox"><p style="margin:0"><b>${esc(tagLabel(t))}</b></p><p class="hint">このタグの他の企業は全て Look・See です。「Look・See を含める」を有効にすると表示されます。</p></div>`);
        continue;
      }
      parts.push(`<details class="peerBox"${first ? " open" : ""}><summary>${esc(tagLabel(t))}<span class="tn">${rows.length}社</span></summary>${peerTableHtml(rows)}</details>`);
      first = false;
    }
  }
  el.innerHTML = parts.join("");
  const w = $("#peerWatch"), s = $("#peerSort");
  if (w) w.addEventListener("change", () => { peerShowWatch = w.checked; renderPeers(d, p); });
  if (s) s.addEventListener("change", () => { peerSortKey = s.value; renderPeers(d, p); });
}

  const news = (p.related_news || []).map(n => { const href = n.via_google_news ? (n.search_url || n.url) : n.url; const media = n.media ? (n.media_url ? `<a class="date" href="${esc(safeUrl(n.media_url))}" target="_blank" rel="noopener noreferrer">${esc(n.media)}</a>` : `<span class="date">${esc(n.media)}</span>`) : ""; return `<li><span class="org ${n.origin === "企業発表" ? "org-p" : ""}">${esc(n.origin || "報道")}</span><span class="date">${esc(n.published || "")}</span><a href="${esc(safeUrl(href))}" target="_blank" rel="noopener noreferrer">${esc(n.title)}</a>${media}</li>`; }).join("");

  $("#det").innerHTML = `<div class="dc"><header class="dh"><div class="top"><span class="badge ${SRC_CLASS[p.source] || ""}">${esc(SRC_LABEL[p.source] || p.source)}</span><span class="st ${p.display_status === "final" ? "st-final" : "st-" + p.display_status}">${esc(SL[p.display_status] || p.display_status)}</span>${dirB(LL)}</div><h3>${esc(dispT(p))}</h3><div class="mi"><span>公開日 ${esc(p.published || "—")}</span>${LL ? `<span>評価日 ${esc(jst(LL.evaluated_at))}</span>` : ""}${p.eval_count ? `<span>評価 ${p.eval_count} 回目</span>` : ""}${LL && LL.llm_model ? `<span>評価モデル ${esc(LL.llm_model)}</span>` : ""}</div></header>

<section class="ds"><h4>技術成熟度（TRL）</h4>${trl(ADJ ? ADJ.to_value : lvl)}${ADJ ? `<p class="note">監査レビューでの調整により、TRL は元の ${ADJ.from_value} から ${ADJ.to_value} に読み替えています。理由: ${esc(ADJ.reason)}（総合点・帯域も、読み替え後の TRL で計算し直した値を表示しています）</p>` : ""}${tr && tr.reason ? `<p>${esc(tr.reason)}</p>` : ""}${tr && tr.level == null && tr.missing_info.length ? `<p class="hint">不足: ${tr.missing_info.map(esc).join(" / ")}</p>` : ""}${tr && tr.awaiting_info && tr.awaiting_info.length ? `<p class="hint">結果待ち: ${tr.awaiting_info.map(esc).join(" / ")}</p>` : ""}<p class="hint">TRLは資料から根拠付きで判断できた場合のみ表示します。技術成熟度スコアからの換算はしません。</p></section>
<section class="ds"><h4>技術評価</h4>${LL ? G.technology.map(k => scoreRow(k, LL.items[k])).join("") : `<p class="hint">未評価です。</p>`}</section>

${LL && REF.some(k => LL.items[k]) ? `<section class="ds"><h4>参考項目</h4><p class="note">参考項目は採点して表示しますが、総合点・必須判定には含めません。根拠が無い場合は未算出となり、それを理由に保留にもなりません。</p>${REF.filter(k => LL.items[k]).map(k => scoreRow(k, LL.items[k])).join("")}</section>` : ""}
${EV ? `<section class="ds"><h4>イベント評価（短期）</h4>${Object.keys(EV.items).map(k => scoreRow(k, EV.items[k])).join("")}<p>総合点 ${EV.total != null ? EV.total + " / 100(" + esc(EV.band || "") + ")" : "未確定"}</p>${EV.prev ? prevCmp(EV, null) : ""}</section>` : ""}
<section class="ds"><h4>総合点（長期）</h4><p>${totalMain}</p>${ADJ ? `<p class="note">この総合点は TRL 調整（${ADJ.from_value} → ${ADJ.to_value}）を反映し、項目点と読み替え後の TRL から計算し直した値です。元の総合点は ${total} でした。理由: ${esc(ADJ.reason)}</p>` : ""}${scopeMain === "technology" ? `<p class="note">これは技術評価の総合点です。事業項目は段階未達のため対象外で、技術軸の項目だけで算出しています。</p>` : ""}${holdCauseTxt(LL) ? `<p class="note">${esc(holdCauseTxt(LL))}</p>` : ""}${LL && LL.total_orig != null && LL.total != null && LL.total_orig !== LL.total ? `<p class="note">評価当時の総合点は ${LL.total_orig}${LL.band_orig ? `（${esc(LL.band_orig)}）` : ""} でした。上の総合点は、重みの改訂に合わせて現行の物差しで計算し直した値です。</p>` : ""}${LL ? `<div class="acts"><button class="btn sec" type="button" id="cpye">評価をコピー</button><button class="btn obsidian" type="button" id="cpym">Markdownでコピー</button></div>` : ""}</section>
${LL && LL.prev ? `<section class="ds"><h4>前回評価との比較</h4>${prevCmp(LL, lvl)}</section>` : ""}
<section class="ds"><h4>材料の方向性</h4>${LL && LL.direction ? `<p>${dirB(LL)} ${esc(LL.direction.reason || "")}</p><p class="hint">方向性は点数やTRLとは独立に、資料が示す出来事の追い風・逆風を判定したものです。</p>` : `<p class="hint">未判定です（方向を決める出来事が資料に無いか、旧基準の評価です）。</p>`}</section>
<section class="ds"><h4>不足している観点</h4>${LL && LL.critical_missing.length ? `<p class="m" style="color:#a96500;font-weight:700">必須項目の不足: ${LL.critical_missing.map(k => esc(label(k))).join("、")}</p>` : ""}${pts(missAll, 1)}${waitAll.length ? `<p class="hint">結果待ち（不足ではなく、治験の結果公表など時間の経過でしか解けないもの）:</p><ul class="pts">${waitAll.map(x => `<li><b>◷</b><span>${esc(x)}</span></li>`).join("")}</ul>` : ""}${q && q.next_sources.length ? `<p class="hint">次に確認する情報源: ${q.next_sources.map(esc).join(" / ")}</p>` : ""}${q && q.reeval_conditions.length ? `<p class="hint">再評価の条件: ${q.reeval_conditions.map(esc).join(" / ")}</p>` : ""}</section>
${p.display_status === "error" && p.long && p.long.errors.length ? `<section class="ds"><h4>処理上の注意</h4>${pts(p.long.errors, 1)}</section>` : ""}
${p.display_status === "rejected" ? `<section class="ds"><h4>除外理由</h4><p>${esc(p.screen_reason ? (SR[p.screen_reason] || p.screen_reason) : "理由は記録されていません")}</p><p class="hint">除外は関連性スクリーニングの機械的な判定で、評価 (採点) は行われていません。</p></section>` : ""}
<section class="ds"><h4>関連事業ニュース（評価に同梱した根拠プール）</h4>${news ? `<ul class="news">${news}</ul>` : `<p class="hint">同梱されたニュースはありません。</p>`}${(p.related_news || []).some(n => n.via_google_news) ? `<p class="hint">Google News 経由の記事リンクは直接開けないため、タイトルをクリックするとタイトル検索で元記事を開きます。媒体名は媒体のサイトへのリンクです。</p>` : ""}</section>
<section class="ds"><h4>関連財務根拠（開示資料の財務数値）</h4>${fins ? `<ul class="news">${fins}</ul>` : `<p class="hint">同梱された財務根拠はありません。</p>`}</section>
<section class="ds"><h4>関連企業</h4>${p.entities.map(e => `<span class="chip">${esc(e.name)}${e.product_name ? "（" + esc(e.product_name) + "）" : ""}${e.market ? "・" + esc(ML[e.market] || e.market) : ""}${e.sector ? "・" + esc(CL[e.sector] || e.sector) : ""}${(e.tags || []).length ? "・" + e.tags.map(t => esc(tagLabel(t))).join("・") : ""}${e.stage ? "・" + esc(STG[e.stage] || e.stage) : ""} ${e.strength === "strong" ? "" : "・弱"}${dtText(e) ? "・" + esc(dtText(e)) : ""}</span>`).join("") || '<span class="hint">関連企業は未特定です。</span>'}</section>
${p.entities.some(e => e.strength === "strong" && (e.tags || []).length) ? `<section class="ds"><h4>同じタグの企業</h4><div id="peers"></div></section>` : ""}
<section class="ds"><h4>調査メモ</h4><textarea id="note" aria-label="調査メモ" placeholder="仮説、確認したい点、次の調査などを記録...">${esc(noteDraft !== null ? noteDraft : getNote(p.id))}</textarea><div class="acts"><button class="btn sec" type="button" id="save">メモを保存</button><button class="btn sec" type="button" id="cpys">出典をコピー</button><a class="btn src" href="${esc(safeUrl(p.url))}" target="_blank" rel="noopener noreferrer">原文サイトを開く ↗</a></div><p id="msg" class="hint" aria-live="polite">メモはこの端末のブラウザにだけ保存されます。</p></section></div>`;
  const evalText = () => {
    // 評価まるごとコピー用テキスト (項目点・理由・TRL・不足・前回比)
    if (!LL) return "";
    const lines = [dispT(p), [p.title, (SRC_LABEL[p.source] || p.source) + (p.published ? " ・ " + p.published : ""), p.url].filter(Boolean).join("\n")];
    const ents = p.entities.filter(e => e.strength === "strong").map(e => e.name);
    if (ents.length) lines.push(`関連企業: ${ents.join("、")}`);
    lines.push(`TRL: ${lvl != null ? lvl : "未確定"}${LL.trl_level && LL.trl_level.reason ? " — " + LL.trl_level.reason : ""}`);
    if (LL.total != null) lines.push(`総合点: ${LL.total} / 100${LL.band ? `（${LL.band}）` : ""}${LL.total_scope === "technology" ? " ※技術軸のみで算出" : ""}`);
    if (ADJ) lines.push(`調整: TRL ${ADJ.from_value} → ${ADJ.to_value}（監査レビューの読み替え）理由: ${ADJ.reason} / 調整後の総合点: ${ADJ.total != null ? ADJ.total + " / 100" : "未確定"}`);
    if (LL.total_orig != null && LL.total != null && LL.total_orig !== LL.total) lines.push(`評価当時の総合点: ${LL.total_orig}${LL.band_orig ? `（${LL.band_orig}）` : ""} ※現行の重みで再計算した値が上の総合点`);
    const order = [...G.technology, ...G.business, ...Object.keys(LL.items)];
    for (const k of [...new Set(order)]) {
      const it = LL.items[k];
      if (!it) continue;
      lines.push(`■ ${label(k)}: ${it.score != null ? it.score + " / 100" : "未算出"}`);
      if (it.reason) lines.push(it.reason);
      if (it.score == null && it.missing_info && it.missing_info.length) lines.push(`不足: ${it.missing_info.join(" / ")}`);
    }
    if (LL.critical_missing && LL.critical_missing.length) lines.push(`必須項目の不足: ${LL.critical_missing.map(label).join("、")}`);
    if (LL.direction) lines.push(`材料の方向性: ${DL[LL.direction.direction] || LL.direction.direction}${LL.direction.reason ? " — " + LL.direction.reason : ""}`);
    if (LL.prev) lines.push(`前回評価: ${jst(LL.prev.evaluated_at)}（${SL[LL.prev.status] || LL.prev.status}） TRL ${LL.prev.trl_level ?? "未確定"} / 総合点 ${LL.prev.total ?? "未確定"}`);
    lines.push(`評価日: ${jst(LL.evaluated_at)}${LL.llm_model ? ` / 評価モデル: ${LL.llm_model}` : ""}`);
    return lines.join("\n");
  };
  const mdNote = () => {
    // Obsidian 等へ貼るための Markdown ノート (trlcore/vault.py の評価ノートと同じ形式)
    if (!LL || LL.status === "error") return "";
    const e0 = (p.entities || [])[0] || {};
    const ver = (d.config && d.config.version) || "";
    const fm = ["---", "type: evaluation", `candidate: "${p.id}"`];
    if (e0.entity_id) fm.push(`company: "${e0.entity_id}"`);
    fm.push(`status: "${p.display_status}"`);
    if (LL.total != null) fm.push(`total: ${LL.total}`);
    if (LL.band) fm.push(`band: "${LL.band}"`);
    if (lvl != null) fm.push(`trl: ${lvl}`);
    if (LL.direction) fm.push(`direction: "${LL.direction.direction}"`);
    if (LL.llm_model) fm.push(`model: "${LL.llm_model}"`);
    fm.push(`evaluated: "${(LL.evaluated_at || "").slice(0, 10)}"`);
    if (ver) fm.push(`config_version: "${ver}"`);
    fm.push(`source: "${p.source}"`);
    if (p.published) fm.push(`published: "${String(p.published).slice(0, 10)}"`);
    if (p.retrieved_at) fm.push(`retrieved: "${String(p.retrieved_at).slice(0, 10)}"`);
    fm.push("---");
    const out = [...fm, "", `# ${dispT(p)}`, ""];
    if (p.title_ja) out.push(`原題: ${p.title}`);
    for (const e of p.entities || []) out.push(`企業: ${e.name}（${e.market || "JP"} / ${e.sector || "未取得"}）`);
    out.push(`出典: [${p.url}](${p.url})（${p.source}）`);
    out.push(`公開: ${p.published ? String(p.published).slice(0, 10) : "未取得"} / 取得: ${p.retrieved_at ? String(p.retrieved_at).slice(0, 10) : "未取得"}`);
    out.push(`評価日時: ${LL.evaluated_at || "未取得"} / 評価モデル: ${LL.llm_model || "未取得"} / 評価基準: ${ver || "未取得"}`);
    out.push("", "## 評価サマリ");
    if (LL.total != null) out.push(`総合点: ${LL.total}（${LL.band || ""}）`);
    else out.push("総合点: 未取得（保留のため算出せず）");
    if (LL.total_orig != null && LL.total != null && LL.total_orig !== LL.total) out.push(`評価当時の総合点: ${LL.total_orig}（${LL.band_orig || ""}）`);
    out.push(`TRL: ${lvl != null ? lvl : "未確定"}`);
    if (LL.trl_level && LL.trl_level.reason) out.push(`TRL の理由: ${LL.trl_level.reason}`);
    if (LL.direction) out.push(`方向性: ${LL.direction.direction}${LL.direction.reason ? " — " + LL.direction.reason : ""}`);
    if (LL.prev) out.push(`前回評価: 総合 ${LL.prev.total ?? "未取得"} / TRL ${LL.prev.trl_level ?? "未確定"} / 状態 ${LL.prev.status}（${LL.prev.evaluated_at || ""}）`);
    out.push("", "## 項目別");
    const order = [...G.technology, ...G.business, ...Object.keys(LL.items)];
    for (const k of [...new Set(order)]) {
      const it = LL.items[k];
      if (!it) continue;
      out.push(`### ${label(k)}: ${it.score != null ? it.score + "点" : "未取得（不足）"}`);
      if (it.reason) out.push(it.reason);
      for (const e of it.evidence || []) out.push(`- 根拠: ${e.summary}${e.ref ? `（[${e.ref}](${e.ref})）` : ""}`);
      for (const ce of it.counter_evidence || []) out.push(`- 反証: ${ce}`);
      const miss = (it.missing_info || []).filter(m => m && m !== "特になし");
      if (miss.length) out.push(`- 不足: ${miss.join(" / ")}`);
      if ((it.awaiting_info || []).length) out.push(`- 結果待ち: ${it.awaiting_info.join(" / ")}`);
      out.push("");
    }
    if (LL.critical_missing && LL.critical_missing.length) { out.push("## 決定的な不足", ...LL.critical_missing.map(k => "- " + label(k)), ""); }
    out.push("## 要旨（原文）", p.abstract || "未取得", "", "## 要旨（日本語訳）", p.abstract_ja || "未取得（未翻訳）");
    return out.join("\n");
  };
  $("#save").addEventListener("click", () => {
    const saved = setNote(p.id, $("#note").value); if (saved) noteDraft = null;
    $("#msg").textContent = saved ? "この端末のブラウザに保存しました。" : "保存できませんでした(ブラウザの保存機能が無効の可能性があります)。";
  });
  const co = $("#cpyo"), cj = $("#cpyj"), cs = $("#cpys"), ce = $("#cpye"), cm = $("#cpym");
  if (co) co.addEventListener("click", () => copyBuilt(() => [p.title, p.abstract].filter(Boolean).join("\n\n"), co));
  if (cj) cj.addEventListener("click", () => copyBuilt(() => [p.title_ja || p.title, p.abstract_ja || p.abstract].filter(Boolean).join("\n\n"), cj));
  if (cs) cs.addEventListener("click", () => copyBuilt(() => [p.title, (SRC_LABEL[p.source] || p.source) + (p.published ? " ・ " + p.published : ""), p.url].filter(Boolean).join("\n"), cs));
  if (ce) ce.addEventListener("click", () => copyBuilt(() => evalText(), ce));
  if (cm) cm.addEventListener("click", () => copyBuilt(() => mdNote(), cm));
  renderPeers(d, p);
}
load();
</script>
</body>
</html>
